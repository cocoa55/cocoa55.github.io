<link rel="icon" href="apple-touch-icon.png" type="image/png">

<style>
  /* Gruvbox dark, neutrals only */
  :root {
    --bg0-h: #1d2021;
    --bg0:   #282828;
    --bg1:   #3c3836;
    --bg2:   #504945;
    --bg3:   #665c54;
    --gray:  #928374;
    --fg4:   #a89984;
    --fg3:   #bdae93;
    --fg2:   #d5c4a1;
    --fg1:   #ebdbb2;
    --fg0:   #fbf1c7;

    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    --sans: "IBM Plex Sans", system-ui, sans-serif;
    --max: 760px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg0);
    color: var(--fg2);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.7;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  a { color: var(--fg1); text-decoration: underline; text-decoration-color: var(--bg3); text-underline-offset: 3px; }
  a:hover { text-decoration-color: var(--fg1); }
  ::selection { background: var(--bg2); color: var(--fg0); }

  /* ---------- editor tab bar ---------- */
  .tabbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg0-h);
    border-bottom: 1px solid var(--bg1);
    font-family: var(--mono);
    font-size: 13px;
  }
  .tabbar-inner {
    display: flex; align-items: stretch;
    overflow-x: auto; scrollbar-width: none;
  }
  .tabbar-inner::-webkit-scrollbar { display: none; }
  .brand {
    padding: 12px 18px; color: var(--fg4); white-space: nowrap;
    border-right: 1px solid var(--bg1); text-decoration: none;
  }
  .brand b { color: var(--fg1); font-weight: 500; }
  .tab {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 18px;
    color: var(--gray); text-decoration: none; white-space: nowrap;
    border-right: 1px solid var(--bg1);
    border-top: 2px solid transparent;
    transition: color .15s, background .15s;
  }
  .tab:hover { color: var(--fg2); background: var(--bg0); }
  .tab.active {
    color: var(--fg1); background: var(--bg0);
    border-top-color: var(--fg3);
  }
  .tab .key { color: var(--bg3); font-size: 11px; }
  .tab.active .key { color: var(--gray); }

  /* ---------- breadcrumb ---------- */
  .crumb {
    font-family: var(--mono); font-size: 12px; color: var(--gray);
    max-width: calc(var(--max) + 120px); margin: 0 auto; width: 100%;
    padding: 14px 16px 0;
  }
  .crumb span { color: var(--fg4); }

  /* ---------- page / code frame ---------- */
  main { flex: 1; width: 100%; }
  .page {
    max-width: calc(var(--max) + 120px);
    margin: 0 auto; padding: 28px 16px 80px;
    animation: fade .25s ease;
  }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .code {
    font-family: var(--mono); font-size: 14px; line-height: 1.8;
    color: var(--fg4);
  }
  .kw  { color: var(--fg3); }
  .fn  { color: var(--fg1); font-weight: 700; }
  .cm  { color: var(--gray); font-style: italic; }
  .str { color: var(--fg2); }
  .dim { color: var(--bg3); }

  .with-gutter { display: grid; grid-template-columns: 44px 1fr; column-gap: 20px; }
  .gutter {
    font-family: var(--mono); font-size: 12px; color: var(--bg2);
    text-align: right; line-height: 1.8; padding-top: 2px; user-select: none;
    border-right: 1px solid var(--bg1); padding-right: 12px;
  }

  /* ---------- home ---------- */
  .hero-name {
    font-family: var(--mono); font-weight: 500;
    font-size: clamp(36px, 7vw, 60px); line-height: 1.1;
    color: var(--fg0); margin: 22px 0 6px; letter-spacing: -0.02em;
  }
  .role { font-family: var(--mono); font-size: 14px; color: var(--fg4); margin-bottom: 28px; }
  /* Earth crescent tucked against the right edge of the home page, clear of the text */
  main { position: relative; overflow-x: clip; }
  .earth-bg {
    --h: 680px;
    position: absolute; top: -40px; right: 0;
    height: var(--h); width: calc(var(--h) * 16 / 9);
    background: url("assets/earth.jpg") center / cover no-repeat;
    /* the lit edge sits at 71% of the photo; slide it to just inside the window's right edge */
    transform: translateX(calc(var(--h) * 16 / 9 * .29 - 28px));
    -webkit-mask-image: linear-gradient(to right, transparent 40%, #000 62%), linear-gradient(to bottom, #000 70%, transparent);
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(to right, transparent 40%, #000 62%), linear-gradient(to bottom, #000 70%, transparent);
    mask-composite: intersect;
    pointer-events: none; z-index: 0;
  }
  .earth-label {
    position: absolute; right: 56px; top: 540px; z-index: 0; pointer-events: none;
    font-family: var(--mono); font-size: 11px; color: var(--gray); font-style: italic;
  }
  .page.home { position: relative; z-index: 1; }
  /* on mid-size screens, keep the intro clear of the crescent on the right */
  @media (min-width: 641px) and (max-width: 1360px) {
    .page.home .prose, .page.home .links, .page.home .goto { max-width: max(420px, calc(100vw - 600px)); }
  }
  .hero { padding: 48px 0 56px; }
  .indent { padding-left: 24px; border-left: 1px dashed var(--bg1); margin-left: 2px; }
  .prose p { margin: 0 0 16px; max-width: 62ch; }
  .prose strong { color: var(--fg1); font-weight: 500; }

  .goto {
    margin: 28px 0 8px; display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; max-width: 62ch;
  }
  .goto a {
    display: block; text-decoration: none;
    border: 1px solid var(--bg1); background: var(--bg0-h);
    padding: 12px 14px; font-family: var(--mono); font-size: 13px;
    color: var(--fg2); transition: border-color .15s, transform .15s;
  }
  .goto a:hover { border-color: var(--fg4); transform: translateY(-2px); }
  .goto a small { display: block; color: var(--gray); font-size: 12px; margin-top: 2px; }

  .links { font-family: var(--mono); font-size: 13px; display: flex; gap: 20px; flex-wrap: wrap; margin-top: 18px; }

  /* ---------- section headings ---------- */
  .section-head { margin-bottom: 28px; }
  .section-head .addr { font-family: var(--mono); font-size: 12px; color: var(--gray); letter-spacing: .08em; }
  .section-head h1 {
    font-family: var(--mono); font-weight: 500; color: var(--fg0);
    font-size: 30px; margin: 4px 0 6px; letter-spacing: -0.01em;
  }
  .section-head p { margin: 0; color: var(--fg4); max-width: 60ch; }

  /* ---------- cards / lists ---------- */
  .card {
    display: block; text-decoration: none; color: inherit;
    border: 1px solid var(--bg1); background: var(--bg0-h);
    padding: 18px 20px; margin-bottom: 14px;
    transition: border-color .15s;
  }
  a.card:hover { border-color: var(--fg4); }
  .card-top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .card h3 { margin: 0; font-family: var(--mono); font-weight: 500; font-size: 16px; color: var(--fg1); }
  .card .meta { font-family: var(--mono); font-size: 12px; color: var(--gray); }
  .card p { margin: 8px 0 0; color: var(--fg3); font-size: 15px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .tag {
    font-family: var(--mono); font-size: 11px; color: var(--fg4);
    border: 1px solid var(--bg2); padding: 1px 8px;
  }

  /* experience timeline */
  .timeline { border-left: 1px solid var(--bg2); margin-left: 6px; }
  .job { position: relative; padding: 0 0 34px 26px; }
  .job::before {
    content: ""; position: absolute; left: -5px; top: 9px;
    width: 9px; height: 9px; background: var(--bg0); border: 1px solid var(--fg4);
  }
  .job:first-child::before { background: var(--fg3); }
  .job h3 { margin: 0; font-family: var(--mono); font-weight: 500; font-size: 16px; color: var(--fg1); }
  .job .where { color: var(--fg3); }
  .job .when { font-family: var(--mono); font-size: 12px; color: var(--gray); }
  .job ul { margin: 10px 0 0; padding-left: 18px; color: var(--fg3); font-size: 15px; }
  .job li { margin-bottom: 4px; }
  .job li::marker { content: "› "; color: var(--gray); }

  /* blog list */
  .post-row {
    display: grid; grid-template-columns: 110px 1fr; gap: 16px;
    padding: 14px 0; border-bottom: 1px dashed var(--bg1);
    text-decoration: none; color: inherit;
  }
  .post-row:hover h3 { text-decoration: underline; text-underline-offset: 3px; }
  .post-row time { font-family: var(--mono); font-size: 13px; color: var(--gray); padding-top: 2px; }
  .post-row h3 { margin: 0; font-family: var(--mono); font-weight: 500; font-size: 15px; color: var(--fg1); }
  .post-row p { margin: 4px 0 0; font-size: 14px; color: var(--fg4); }

  /* article */
  .article h1 { font-family: var(--mono); font-weight: 500; color: var(--fg0); font-size: 28px; line-height: 1.25; margin: 6px 0 8px; }
  .article .meta { font-family: var(--mono); font-size: 12px; color: var(--gray); margin-bottom: 30px; }
  .article h2 { font-family: var(--mono); font-weight: 500; color: var(--fg1); font-size: 18px; margin: 34px 0 10px; }
  .article h2::before { content: "## "; color: var(--bg3); }
  .article p { max-width: 66ch; }
  .article ul { padding-left: 20px; max-width: 66ch; }
  .article li { margin-bottom: 8px; }
  .article strong { color: var(--fg1); font-weight: 500; }
  pre {
    background: var(--bg0-h); border: 1px solid var(--bg1);
    padding: 16px 18px; overflow-x: auto;
    font-family: var(--mono); font-size: 13px; line-height: 1.7; color: var(--fg3);
  }
  code { font-family: var(--mono); font-size: .9em; background: var(--bg1); padding: 1px 5px; color: var(--fg1); }
  pre code { background: none; padding: 0; color: inherit; font-size: inherit; }
  .back { font-family: var(--mono); font-size: 13px; display: inline-block; margin-bottom: 18px; color: var(--fg4); text-decoration: none; }
  .back:hover { color: var(--fg1); }

  /* books */
  .featured { display: grid; grid-template-columns: 1.3fr 1fr; gap: 14px; margin-bottom: 40px; }
  .feature {
    border: 1px solid var(--bg2); background: var(--bg0-h); padding: 20px 22px;
    display: grid; grid-template-columns: 110px 1fr; gap: 20px; align-items: start;
  }
  .cover {
    position: relative; width: 72px; aspect-ratio: 2 / 3; flex-shrink: 0;
    background: var(--bg1); border: 1px solid var(--bg2); overflow: hidden;
  }
  .cover.lg { width: 110px; }
  .cover img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    filter: sepia(.25) brightness(.92);
    transition: filter .2s;
  }
  .book:hover .cover img, .feature:hover .cover img { filter: none; }
  .cover-fallback {
    position: absolute; inset: 0; padding: 8px;
    font-family: var(--mono); font-size: 10px; line-height: 1.3; color: var(--fg4);
    display: flex; align-items: flex-end; overflow-wrap: anywhere;
  }
  .cover img + .cover-fallback, .cover:has(img) .cover-fallback { visibility: hidden; }
  .feature:first-child { border-color: var(--fg4); }
  .feature-label { font-family: var(--mono); font-size: 12px; color: var(--gray); font-style: italic; }
  .feature h3 { font-family: var(--mono); font-weight: 500; color: var(--fg0); font-size: 22px; margin: 10px 0 2px; }
  .feature .by { font-family: var(--mono); font-size: 13px; color: var(--fg4); }
  .feature p { color: var(--fg3); font-size: 15px; margin: 12px 0 0; }
  .tbd { font-family: var(--mono); font-size: 14px; color: var(--gray); padding: 14px 0; border-top: 1px dashed var(--bg1); }
  .disclaimer { font-family: var(--mono); font-size: 12px; color: var(--gray); font-style: italic; margin: -14px 0 24px; }
  .subhead { font-family: var(--mono); font-size: 13px; color: var(--fg4); font-style: italic; margin-bottom: 12px; }
  @media (max-width: 640px) {
    .featured { grid-template-columns: 1fr; }
    .feature { grid-template-columns: 84px 1fr; gap: 16px; padding: 16px; }
    .cover.lg { width: 84px; }
    .feature h3 { font-size: 18px; }  }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; font-family: var(--mono); font-size: 12px; }
  .filters button {
    font: inherit; background: transparent; color: var(--fg4);
    border: 1px solid var(--bg2); padding: 4px 12px; cursor: pointer;
  }
  .filters button:hover { color: var(--fg1); border-color: var(--fg4); }
  .filters button.on { background: var(--fg3); color: var(--bg0); border-color: var(--fg3); }
  .books { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: 14px; }
  .book { border: 1px solid var(--bg1); background: var(--bg0-h); display: flex; gap: 16px; padding: 14px; }
  .book-body { font-size: 14px; color: var(--fg3); flex: 1; min-width: 0; }
  .book-body .t { font-family: var(--mono); color: var(--fg1); font-size: 14px; line-height: 1.35; font-weight: 500; }
  .book-body .a { font-family: var(--mono); color: var(--gray); font-size: 11px; margin-top: 3px; }
  .book-body p { margin: 8px 0 0; line-height: 1.55; }
  .book-link { display: inline-block; font-family: var(--mono); font-size: 12px; margin-top: 10px; color: var(--fg4); }
  .resources { border-top: 1px dashed var(--bg1); }
  .resource {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; align-items: center;
    padding: 12px 4px; border-bottom: 1px dashed var(--bg1);
    text-decoration: none; color: inherit; transition: background .15s;
  }
  .resource:hover { background: var(--bg0-h); }
  .resource:hover .r-name { text-decoration: underline; text-underline-offset: 3px; }
  .r-name { font-family: var(--mono); color: var(--fg1); font-size: 14px; }
  .r-who { grid-row: 2; font-size: 13px; color: var(--gray); }
  .resource .tag { grid-row: 1 / span 2; grid-column: 2; }

  /* ---------- status line ---------- */
  .statusline {
    position: sticky; bottom: 0; z-index: 10;
    display: flex; align-items: stretch;
    background: var(--bg1); font-family: var(--mono); font-size: 12px;
    color: var(--fg4); border-top: 1px solid var(--bg2);
  }
  .statusline > div { padding: 4px 12px; white-space: nowrap; }
  .statusline .mode { background: var(--fg3); color: var(--bg0); font-weight: 700; }
  .statusline .file { background: var(--bg2); color: var(--fg1); }
  .statusline .spacer { flex: 1; }
  .statusline .sp { color: var(--fg2); font-variant-numeric: tabular-nums; }
  .back .pop { color: var(--bg3); font-size: 11px; margin-left: 6px; }
  .statusline .hint { color: var(--gray); }

  @media (max-width: 640px) {
    .with-gutter { grid-template-columns: 1fr; }
    .gutter { display: none; }
    .indent { padding-left: 14px; }
    .earth-bg { --h: 440px; opacity: .45; }
    .earth-label { display: none; }
    .hero { padding: 32px 0 40px; }
    .post-row { grid-template-columns: 1fr; gap: 2px; }
    .statusline .hint, .statusline .enc, #sl-pos { display: none; }
    .statusline > div { padding: 4px 8px; font-size: 11px; }
    .statusline .file { overflow: hidden; text-overflow: ellipsis; min-width: 0; flex-shrink: 1; }
    .tab .key { display: none; }
    .goto { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>

/* ===================================================================
   ROUTING + RENDERING

const TABS = [
  { path: "",           file: "about.cpp",      label: "about.cpp" },
  { path: "projects",   file: "projects.hpp",   label: "projects.hpp" },
  { path: "experience", file: "experience.log", label: "experience.log" },

const app = document.getElementById("app");
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function renderTabs(active) {
  document.getElementById("tabs").innerHTML =
    `<a class="brand" href="#/">~/<b>${esc(ME.handle)}</b></a>` +
    TABS.map((t, i) =>
      `<a class="tab ${t.path === active ? "active" : ""}" href="#/${t.path}">
         <span class="key">${i + 1}</span>${t.label}

function gutter(n) {
  return `<div class="gutter">${Array.from({ length: n }, (_, i) => i + 1).join("<br>")}</div>`;
}

// Each tab is a stack frame; the stack grows down, so tabs further right sit at lower
// addresses, and opening a project or post pushes one more frame below its tab.
const STACK_BASE = 0x7ffd5e3c2400;
const FRAME = 0x40;
const frameAddr = (tab, depth = 0) => STACK_BASE - tab * FRAME - depth * 0x20;
const hex = n => "0x" + n.toString(16);

let sp = null;
function moveSp(target) {
  const el = document.getElementById("sl-sp");
  if (sp === null) { sp = target; el.textContent = "sp " + hex(sp); return; }
  const step = target < sp ? -8 : 8;
  clearInterval(moveSp.timer);
  moveSp.timer = setInterval(() => {
    sp = Math.abs(target - sp) <= 8 ? target : sp + step;
    el.textContent = "sp " + hex(sp);
    el.classList.toggle("push", target < sp || (sp === target && step < 0));
    if (sp === target) clearInterval(moveSp.timer);
  }, 12);
}

function sectionHead(addr, title, desc) {
  return `<div class="section-head">
    <div class="addr">${addr}</div>
    <h1>${title}</h1>
    ${desc ? `<p>${desc}</p>` : ""}
  </div>`;
}

// Covers come from Open Library by ISBN; if one is missing, a plain title block shows instead
function cover(b, cls = "") {
  return `<div class="cover ${cls}">
    <span class="cover-fallback">${esc(b.title)}</span>
    ${b.isbn ? `<img src="https://covers.openlibrary.org/b/isbn/${b.isbn}-L.jpg?default=false" alt="Cover of ${esc(b.title)}" loading="lazy" onerror="this.remove()">` : ""}
  </div>`;
}

function renderBooks(shelf) {
  const list = BOOKS.filter(b => shelf === "all" || b.shelf === shelf);
  document.getElementById("books").innerHTML = list.map(b => `
    <div class="book">
      ${cover(b)}
      <div class="book-body">
        <div class="t">${esc(b.title)}</div>
        <div class="a">${esc(b.author)} · #${esc(b.shelf)}</div>
        ${b.note ? `<p>${esc(b.note)}</p>` : ""}
        ${b.url ? `<a class="book-link" href="${b.url}" target="_blank" rel="noopener">read it → ${esc(b.label || "link")}</a>` : ""}
      </div>
    </div>`).join("");
}

function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  const [top = "", sub] = parts;
  let html, file;

  if (top === "")                 { html = views.home(); file = "about.cpp"; }
  else if (top === "projects")    { html = views.projects(); file = "projects.hpp"; }
  else if (top === "experience")  { html = views.experience(); file = "experience.log"; }
  // blog is hidden for now; restore this line and its tab to bring it back
  // else if (top === "blog")     { html = sub ? views.post(sub) : views.blog(); file = sub ? `blog/${sub}.md` : "blog/"; }
  else if (top === "books")       { html = views.books(); file = "books.md"; }
  else                            { html = views.notFound(); file = "???"; }

  renderTabs(TABS.some(t => t.path === top) ? top : null);
  const tabIdx = Math.max(0, TABS.findIndex(t => t.path === top));
  moveSp(frameAddr(tabIdx, sub && top === "blog" ? 1 : 0));
  app.innerHTML = html;
  document.getElementById("crumb").innerHTML = `~/${esc(ME.handle)}/<span>${esc(file)}</span>`;
  document.getElementById("sl-file").textContent = file;
  document.getElementById("sl-pos").textContent = "ln 1";
  window.scrollTo(0, 0);

  if (top === "books") {
    renderBooks("all");
    app.querySelectorAll(".filters button").forEach(btn => btn.addEventListener("click", () => {
      app.querySelectorAll(".filters button").forEach(b => b.classList.toggle("on", b === btn));
      renderBooks(btn.dataset.shelf);
    }));
  }
}

// fake cursor position in the status line as you scroll
window.addEventListener("scroll", () => {
  const ln = Math.max(1, Math.round(window.scrollY / 24) + 1);
  document.getElementById("sl-pos").textContent = `ln ${ln}`;
});

// 1–4 jumps between tabs, like switching buffers
window.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || /input|textarea/i.test(e.target.tagName)) return;
  const i = parseInt(e.key, 10) - 1;
  if (i >= 0 && i < TABS.length) location.hash = "#/" + TABS[i].path;
});

window.addEventListener("hashchange", route);
route();
